name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest  # เปลี่ยนเป็น Linux แทน Windows เพื่อให้ Docker ทำงานได้ดีขึ้น

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # อัปเดตเป็น v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3  # เปลี่ยนจาก v2 เป็น v3
        with:
          path: /tmp/.buildx-cache  # เปลี่ยน path ให้เหมาะกับ Linux
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v3
        with:
          context: .  # ใช้ path ปัจจุบัน
          file: Dockerfile.backend  # ระบุ Dockerfile สำหรับ Backend
          push: true
          tags: myusername/project-backend:latest

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v3
        with:
          context: .  # ใช้ path ปัจจุบัน
          file: Dockerfile.frontend  # ระบุ Dockerfile สำหรับ Frontend
          push: true
          tags: myusername/project-fullstack-cpi 
