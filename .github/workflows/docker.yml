name: Docker Build and Push

on:
  push:
    branches:
      - main  # กำหนดให้ทำงานเมื่อมีการ push ไปที่ branch main
  pull_request:
    branches:
      - main  # ทำงานเมื่อมีการ pull request ไปที่ branch main

jobs:
  build:
    runs-on: windows-latest  # ใช้ Windows ในการรันงาน

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # เช็คเอาท์โค้ดจาก repository

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2  # ใช้ Docker Buildx เพื่อสร้างและ push image

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: C:\tmp\.buildx-cache  # เก็บ cache ของ Docker layers (เปลี่ยนเส้นทางตามระบบปฏิบัติการ Windows)
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # ใช้ Docker Hub username จาก secrets
          password: ${{ secrets.DOCKER_PASSWORD }}  # ใช้ Docker Hub Access Token จาก secrets

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .  # ไดเรกทอรีที่ Dockerfile อยู่
          push: true  # ทำการ push ไปที่ Docker Hub
          tags: myusername/project-fullstack-cpi   # ใส่ชื่อ image ของคุณ
